<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCampus - Waste Reporting</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #1f7a4d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1f7a4d;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #1f7a4d;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #145c39;
        }

        .success {
            margin-top: 20px;
            padding: 12px;
            background: #d4edda;
            color: #155724;
            border-radius: 7px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>♻️ CleanCampus</h1>
        <p>Smart Waste Reporting System</p>
    </div>

    <div class="container">

        <h2>Report Waste</h2>

        <form method="POST" enctype="multipart/form-data">

            <label>Waste Type</label>

            <select name="waste_type" required>
                <option value="">Select Waste Type</option>
                <option value="Plastic">Plastic</option>
                <option value="Food Waste">Food Waste</option>
                <option value="Paper">Paper</option>
                <option value="E-Waste">E-Waste</option>
                <option value="Other">Other</option>
            </select>

            <label>Location</label>

            <input
                type="text"
                name="location"
                placeholder="Example: College Canteen"
                required
            >

            <label>Description</label>

            <textarea
                name="description"
                placeholder="Describe the waste problem..."
                required
            ></textarea>

            <button type="submit">
                🚀 Submit Waste Report
            </button>
            <label>Waste Photo:</label>
<input type="file" name="photo" accept="image/*">
<br><br>

        </form>

        {% if message %}
        <div class="success">
            {{ message }}
        </div>
        {% endif %}

    </div>

</body>
</html>
