<!DOCTYPE html>
<html>
<head>
    <title>CleanCampus</title>
</head>

<body>

    <h1>♻️ CleanCampus</h1>
    <h2>Smart Waste Reporting System</h2>

    <p>Report waste or cleanliness problems on campus.</p>

    <form>

        <label>Waste Type:</label>

        <select>
            <option>Plastic Waste</option>
            <option>Food Waste</option>
            <option>E-Waste</option>
            <option>Overflowing Dustbin</option>
            <option>Other</option>
        </select>

        <br><br>

        <label>Location:</label>
        <input type="text" placeholder="Example: College Canteen">

        <br><br>

        <label>Description:</label>
        <br>

        <textarea rows="5" cols="40"
            placeholder="Describe the problem..."></textarea>

        <br><br>

        <label>Upload Photo:</label>
        <input type="file">

        <br><br>

        <button type="submit">Submit Report</button>

    </form>

</body>
</html>
